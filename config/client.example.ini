; Configuración del AGENTE CLIENTE (equipo del alumno).
; Copia este fichero como "client.ini" y ajústalo en cada equipo.
; El TOKEN debe ser IDÉNTICO al de admin.ini y mantenerse en secreto.

[client]
; IP de la máquina del profesor (la consola de administrador).
admin_host = 192.168.1.10
admin_port = 47800

; Clave precompartida. Cámbiala por una cadena larga y aleatoria.
token = cambia-este-token-por-uno-largo-y-secreto

; Reintento de conexión (segundos) si la consola no está disponible aún.
reconnect_seconds = 5

; Calidad de la miniatura en la rejilla (el profesor la sube al enfocar).
grid_fps = 2
grid_scale = 0.25
grid_quality = 35

; Permisos del equipo (política del centro).
allow_remote_control = true
allow_power = true
allow_lock = true
; allow_manage: procesos, bloqueo de apps y de webs.
allow_manage = true
; allow_files: recibir archivos del profesor.
allow_files = true
; Carpeta donde guardar los archivos recibidos (vacío = Escritorio\ClassroomControl).
download_dir =

; Mostrar el aviso visible de supervisión (recomendado: true, por transparencia).
show_indicator = true

; Cifrado TLS (opcional). Debe coincidir con el admin. Si lo activas, copia
; server.crt (generado en el profesor) junto a este archivo.
use_tls = false
ca_cert = server.crt
