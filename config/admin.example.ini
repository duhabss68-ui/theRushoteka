; Configuración de la CONSOLA DE ADMINISTRADOR (equipo del profesor).
; Copia este fichero como "admin.ini" y ajústalo.
; El TOKEN debe ser IDÉNTICO al de client.ini y mantenerse en secreto.

[admin]
; Interfaz en la que escuchar. 0.0.0.0 = todas las interfaces de red.
listen_host = 0.0.0.0
listen_port = 47800

; Clave precompartida. Debe coincidir con la de los clientes.
token = cambia-este-token-por-uno-largo-y-secreto

; Calidad al ENFOCAR un equipo (vista ampliada / control remoto).
focus_fps = 12
focus_scale = 1.0
focus_quality = 70

; Número de columnas de la rejilla (8 columnas x 5 filas = 40 equipos).
columns = 8
